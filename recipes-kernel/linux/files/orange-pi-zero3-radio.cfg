# The UWE5622 Kconfig selects both transports if both SoC families are enabled.
# Rockchip's CONFIG_WCN_PARSE_DTS prevents the Allwinner platform device from registering.
# CONFIG_ARCH_ROCKCHIP is not set
# CONFIG_RK_WIFI_DEVICE_UWE5622 is not set
CONFIG_SPARD_WLAN_SUPPORT=y
CONFIG_WLAN_UWE5622=m
CONFIG_SPRDWL_NG=m
CONFIG_TTY_OVERY_SDIO=m
CONFIG_TTY_OVERY_SDIO_BT_VENDOR_INIT=y
CONFIG_SUNXI_ADDR_MGT=m
