BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "orangepi-zero"
BBFILE_PATTERN_orangepi-zero = "^${LAYERDIR}/"
BBFILE_PRIORITY_orangepi-zero = "19"
LAYERDEPENDS_orangepi-zero = "core sunxi"
LAYERSERIES_COMPAT_orangepi-zero = "wrynose"

# meta-sunxi registers its layer directory as an anchored pattern.
RICHYO_SUNXI_BSPDIR = "${@d.getVar('BBFILE_PATTERN_sunxi').removeprefix('^').rstrip('/')}"
PREFERRED_VERSION_linux-mainline:orange-pi-zero3 = "6.18.63"
PREFERRED_VERSION_u-boot:orange-pi-zero3 = "2026.10"
# The built-in SPI0 controller needs this modular DMA provider for the onboard flash.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS:append:orange-pi-zero3 = " kernel-module-dwmac-sun8i kernel-module-motorcomm kernel-module-sun6i-dma"
