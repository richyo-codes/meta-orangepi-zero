BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "richyosunxi"
BBFILE_PATTERN_richyosunxi = "^${LAYERDIR}/"
BBFILE_PRIORITY_richyosunxi = "19"
LAYERDEPENDS_richyosunxi = "core sunxi"
LAYERSERIES_COMPAT_richyosunxi = "wrynose"

# meta-sunxi registers its layer directory as an anchored pattern.
RICHYO_SUNXI_BSPDIR = "${@d.getVar('BBFILE_PATTERN_sunxi').removeprefix('^').rstrip('/')}"
PREFERRED_VERSION_linux-mainline:orange-pi-zero3 = "6.18.63"
PREFERRED_VERSION_u-boot:orange-pi-zero3 = "2026.10"
